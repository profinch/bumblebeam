[package]
name = "bumblebeam-solver"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "BumbleBeam: open CPU solver and miner for Beam's BeamHash III, every solution checked by the oracle"

[dependencies]
rayon = "1"
hex = "0.4"
rand = "0.8"
serde_json = "1"
anyhow = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
debug = 1
codegen-units = 1
lto = "thin"
