<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thermo</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/ui/tokens.css">
<link rel="stylesheet" href="/ui/base.css">
<link rel="stylesheet" href="/ui/components.css">
<link rel="stylesheet" href="/style.css">
<script src="/ui/components/bb.js"></script>
<script src="/ui/components/tips.js"></script>
</head>
<body>
<bb-eco here="thermo"></bb-eco>
<header class="top">
  <div class="top-row">
    <a class="brand" href="/">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <defs><linearGradient id="lg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" style="stop-color:var(--logo-from)"/><stop offset="1" style="stop-color:var(--logo-to)"/></linearGradient></defs>
        <path class="hex" d="M16 2 28 9v14L16 30 4 23V9z" fill="url(#lg)"/>
        <rect x="13.6" y="6.5" width="4.8" height="14" rx="2.4" style="fill:var(--bg)"/>
        <circle cx="16" cy="21.5" r="4.4" style="fill:var(--bg)"/>
        <rect class="merc" x="15" y="11" width="2" height="9" rx="1" style="fill:var(--color-yellow)"/>
        <circle cx="16" cy="21.5" r="2.7" style="fill:var(--color-yellow)"/>
        <path d="M19.6 9.5h2M19.6 12.5h1.4M19.6 15.5h2" stroke="#fff" stroke-width="1.1" stroke-linecap="round" stroke-opacity=".8"/>
      </svg>
      <span><em id="host"></em> <b>Thermo</b></span>
    </a>
    <div class="hw" id="hw"></div>
    <div class="pill-status demo" id="live"><i></i><span>connecting…</span></div>
  </div>
</header>

<main>
  <div class="page-head">
    <h1 class="page-title">Now</h1>
    <div class="actions">
      <div class="seg" id="smooth" role="group" aria-label="Temperature smoothing" title="Temperature smoothing: moving average"></div>
      <div class="seg range" id="range" role="group" aria-label="Range"></div>
    </div>
  </div>

  <div id="alerts"></div>
  <div class="tiles" id="tiles"></div>
  <div id="groups"></div>

  <section class="panel" id="nvme-panel">
    <div class="panel-head"><h2 class="panel-title">NVMe: health and throttling</h2>
      <div class="panel-meta">SMART over the admin ioctl, every 10 s</div></div>
    <div class="table-wrap"><table id="nvme"></table></div>
  </section>

  <section class="panel">
    <div class="panel-head"><h2 class="panel-title">Events</h2>
      <div class="panel-meta"><span id="ev-count"></span></div></div>
    <div class="table-wrap"><table id="events"></table></div>
    <div class="more"><button class="btn ghost small" id="ev-more" hidden>Show more</button></div>
  </section>
</main>

<footer class="foot">
  <span>Thermo · <a href="/api/now">api/now</a> · <a href="/api/events">api/events</a></span>
  <span class="foot-copy" id="src"></span>
</footer>
<div class="tip bb-tip on" id="tip" hidden></div>
<script src="/app.js"></script>
</body>
</html>
