<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>3BMiner Cam</title><link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
:root{--a:#00f6d2;--y:#f4ce4a;--r:#f25f5b;--m:rgba(255,255,255,.5);--td:rgba(255,255,255,.8);--b:rgba(255,255,255,.07);--s:rgba(255,255,255,.04);--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}html{background:#0a5a80}
body{margin:0;min-height:100vh;color:#fff;font:14px -apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:linear-gradient(180deg,#031d35,#043a5b 55%,#0a5a80) fixed}
a{color:var(--a);text-decoration:none}.w{max-width:1200px;margin:0 auto;padding:0 16px 24px}
header{display:flex;align-items:center;flex-wrap:wrap;gap:0 18px;min-height:64px}
.brand{display:flex;align-items:center;gap:11px;color:#fff;font-weight:700;font-size:19px;white-space:nowrap;min-width:0}
.brand b{background:linear-gradient(135deg,#0b76ff,#39fff2);-webkit-background-clip:text;background-clip:text;color:transparent}.brand em{font-style:normal;font-weight:400;color:var(--m);font-size:15px}
.logo { width: 42px; height: 42px; overflow: visible; }
.logo .hex { filter: drop-shadow(0 0 0 rgba(57, 255, 242, 0)); animation: logo-glow 3s ease-in-out infinite; }
.logo .bee { animation: logo-bob 3s ease-in-out infinite; }
.logo .wing { transform-box: fill-box; transform-origin: 50% 100%; animation: logo-flutter .22s ease-in-out infinite alternate; }
.logo .wr { animation-delay: -.11s; }
.logo .trail path { animation: logo-trail 1.5s ease-in-out infinite; }
.logo .trail .t2 { animation-delay: -.5s; }
.logo .eye { animation: logo-blink 4s steps(1) infinite; }
@keyframes logo-glow { 0%, 100% { filter: drop-shadow(0 0 0 rgba(57, 255, 242, 0)); } 50% { filter: drop-shadow(0 0 6px rgba(57, 255, 242, .55)); } }
@keyframes logo-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-.9px); } }
@keyframes logo-flutter { from { transform: rotate(-9deg) scaleY(.92); } to { transform: rotate(9deg) scaleY(1.05); } }
@keyframes logo-trail { 0%, 100% { stroke-opacity: .25; transform: translateX(1.2px); } 50% { stroke-opacity: .85; transform: translateX(-1px); } }
@keyframes logo-blink { 0%, 93%, 100% { opacity: 1; } 95%, 98% { opacity: 0; } }
.brand:hover .logo .wing{animation-duration:.14s}
@media (prefers-reduced-motion: reduce) { .logo .hex, .logo .bee, .logo .wing, .logo .trail path, .logo .eye { animation: none; } .logo .trail path { stroke-opacity: .6; } }
nav{margin-left:auto;display:flex;gap:4px}nav a{color:var(--td);font-size:13px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;padding:8px 11px;border-bottom:2px solid transparent}nav a.on{color:#fff;border-bottom-color:var(--a)}
.pill{font:700 11px var(--mono);padding:5px 10px;border-radius:99px;border:1px solid;color:var(--m);border-color:var(--b);white-space:nowrap}.pill.on{color:var(--a);border-color:rgba(0,246,210,.5)}
@media(max-width:700px){#st{margin-left:auto}nav{order:3;flex:1 1 100%;margin:0}.brand em{display:none}}
.lay{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;align-items:start}@media(max-width:900px){.lay{grid-template-columns:1fr}}
.p{background:var(--s);border:1px solid var(--b);border-radius:8px;padding:14px 16px;margin-bottom:12px}
.k{font:700 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--m);margin-bottom:10px}
.view{background:#000;border-radius:6px;min-height:200px;display:flex;align-items:center;justify-content:center;overflow:hidden}.view img{max-width:100%;display:block}
.view span{font:12px var(--mono);color:var(--m)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.btn{cursor:pointer;font:700 12px var(--mono);color:var(--a);background:rgba(0,246,210,.06);border:1px solid rgba(0,246,210,.6);border-radius:6px;padding:8px 14px}.btn:hover{background:rgba(0,246,210,.18)}.btn.gh{color:var(--td);border-color:rgba(255,255,255,.18);background:none}
.f{display:grid;grid-template-columns:110px 1fr 34px;align-items:center;gap:8px;margin:7px 0;font:12px var(--mono)}.f label{color:var(--td)}.f output{color:var(--m);text-align:right}
input[type=range]{width:100%;accent-color:#00f6d2}select,input[type=text],input[type=number]{width:100%;padding:6px 8px;background:#193b55;border:1px solid var(--b);border-radius:6px;color:#fff;font:12px var(--mono)}
.sw{position:relative;width:34px;height:18px;appearance:none;-webkit-appearance:none;background:rgba(255,255,255,.15);border-radius:9px;cursor:pointer;margin:0;justify-self:start}.sw::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.15s}.sw:checked{background:#00c8b0}.sw:checked::after{left:18px}
.f.off{opacity:.4}details summary{cursor:pointer;font:700 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--m);list-style:none}details summary::before{content:'+ ';color:var(--a)}details[open] summary::before{content:'- '}
.msg{font:12px var(--mono);color:var(--y)}.sm{font:11px var(--mono);color:var(--m)}
</style></head><body><div class=w>
<header><a class=brand href="/"><svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#0b76ff"/><stop offset="1" stop-color="#39fff2"/></linearGradient><clipPath id="lc"><rect x="9.5" y="13.5" width="15" height="9" rx="4.5"/></clipPath></defs><path class="hex" d="M16 2 28 9v14L16 30 4 23V9z" fill="url(#lg)"/><g class="bee"><g class="trail" stroke="#fff" stroke-width="1.3" stroke-linecap="round"><path class="t1" d="M4.5 20h3.5"/><path class="t2" d="M3.5 23.5h2.5"/></g><ellipse class="wing wl" cx="14.5" cy="10.8" rx="3.6" ry="2.1" transform="rotate(-24 14.5 10.8)" fill="#fff" fill-opacity=".9" stroke="#042548" stroke-width=".6"/><ellipse class="wing wr" cx="20" cy="10.8" rx="3.6" ry="2.1" transform="rotate(24 20 10.8)" fill="#fff" fill-opacity=".9" stroke="#042548" stroke-width=".6"/><rect x="9.5" y="13.5" width="15" height="9" rx="4.5" fill="#042548"/><g clip-path="url(#lc)" fill="#f4ce4a"><rect x="13.3" y="13" width="3" height="10"/><rect x="18.6" y="13" width="3" height="10"/></g><circle class="eye" cx="22.6" cy="17" r=".95" fill="#39fff2"/></g></svg><span><b>3B</b>Miner <i style="font-style:normal;font-weight:400">Cam</i> <em id=host></em></span></a>
<nav><a href="/">Dashboard</a><a href="/camera" class=on>Camera</a></nav><span id=st class=pill>idle</span></header>
<div class=lay><div>
<div class=p><div class=view id=view><span>press Still or Stream</span></div>
<div class=row><button class=btn id=still>Still</button><button class=btn id=strm>Start stream</button><a class="btn gh" id=save-img download="capture.jpg" href="#" style="display:none">Save image</a><span class=sm id=info></span></div></div>
<div class=p><div class=k>Links</div><div class=sm>still <a id=l1 href="/capture">/capture</a> &middot; bitmap <a href="/bmp">/bmp</a> &middot; stream <a id=l2 href="#">:81/stream</a> &middot; settings <a href="/status">/status</a></div></div>
</div><div>
<div class=p><div class=k>Picture</div><div id=g1></div></div>
<div class=p><div class=k>Light</div><div id=g2></div></div>
<div class=p><div class=k>Corrections</div><div id=g3></div></div>
<div class=p><div class=row style="margin:0"><button class=btn id=sv>Save as default</button><button class="btn gh" id=rl>Reload</button><span class=msg id=m></span></div><p class=sm style="margin:10px 0 0">Changes apply at once; Save keeps them across restarts.</p></div>
<div class=p><details><summary>Advanced</summary>
<div class=f><label>XCLK, MHz</label><input type=number id=xclk min=2 max=32 value=20><button class="btn gh" style="padding:5px 6px" id=xs>set</button></div>
<div class=f><label>Register</label><input type=text id=rg placeholder="0x111"><span></span></div>
<div class=f><label>Mask / value</label><input type=text id=rmv placeholder="0xff / 0x00"><span></span></div>
<div class=row><button class="btn gh" id=rget>Read</button><button class="btn gh" id=rset>Write</button><span class=msg id=rm></span></div></details></div>
</div></div></div>
<script>
const Q=new URLSearchParams(location.search),LOCAL=location.protocol=='file:',H=LOCAL?(Q.get('h')||'192.168.1.231'):location.hostname,B=LOCAL?'http://'+H:'',S='http://'+H+':81/stream',$=i=>document.getElementById(i);
$('l1').href=B+'/capture';$('l2').href=S;$('l2').textContent=S.replace('http://','');
const FS=[['UXGA 1600x1200',15],['SXGA 1280x1024',14],['HD 1280x720',13],['XGA 1024x768',12],['SVGA 800x600',11],['VGA 640x480',10],['HVGA 480x320',9],['CIF 400x296',8],['QVGA 320x240',6],['240x240',5],['HQVGA 240x176',4],['QCIF 176x144',3],['QQVGA 160x120',1],['96x96',0]];
const FX=['None','Negative','Grayscale','Red tint','Green tint','Blue tint','Sepia'],WB=['Auto','Sunny','Cloudy','Office','Home'],GC=['2x','4x','8x','16x','32x','64x','128x'];
// [var, label, kind, min, max] kind: r range, s switch, o options
const G={g1:[['framesize','Resolution','o',FS],['quality','Quality','r',4,63],['brightness','Brightness','r',-2,2],['contrast','Contrast','r',-2,2],['saturation','Saturation','r',-2,2],['special_effect','Effect','o',FX.map((n,i)=>[n,i])],['hmirror','Mirror','s'],['vflip','Flip','s']],
g2:[['led_intensity','Flash LED','r',0,255],['awb','Auto white bal.','s'],['awb_gain','AWB gain','s'],['wb_mode','WB mode','o',WB.map((n,i)=>[n,i])],['aec','Auto exposure','s'],['aec2','AEC DSP','s'],['ae_level','AE level','r',-2,2],['aec_value','Exposure','r',0,1200],['agc','Auto gain','s'],['agc_gain','Gain','r',0,30],['gainceiling','Gain ceiling','o',GC.map((n,i)=>[n,i])]],
g3:[['bpc','Black pixels','s'],['wpc','White pixels','s'],['raw_gma','Raw gamma','s'],['lenc','Lens corr.','s'],['dcw','Downsize (DCW)','s'],['colorbar','Color bars','s']]};
for(const g in G)$(g).innerHTML=G[g].map(c=>{const[v,l,k,a,b]=c;let i=k=='r'?'<input type=range id=c-'+v+' min='+a+' max='+b+'>':k=='s'?'<input type=checkbox class=sw id=c-'+v+'>':'<select id=c-'+v+'>'+a.map(o=>'<option value='+o[1]+'>'+o[0]+'</option>').join('')+'</select>';
return'<div class=f id=f-'+v+'><label for=c-'+v+'>'+l+'</label>'+i+'<output id=o-'+v+'></output></div>'}).join('');
const dep=()=>{const t=(i,on)=>$('f-'+i).classList.toggle('off',on);t('aec_value',$('c-aec').checked);t('agc_gain',$('c-agc').checked);t('gainceiling',!$('c-agc').checked);t('wb_mode',!$('c-awb').checked)};
function set(v,val){fetch(B+'/control?var='+v+'&val='+val).then(r=>{$('m').textContent=r.ok?'':'rejected: '+v})}
document.querySelectorAll('[id^=c-]').forEach(e=>{const v=e.id.slice(2);e.onchange=()=>{const val=e.type=='checkbox'?(e.checked?1:0):e.value;set(v,val);dep()};if(e.type=='range')e.oninput=()=>$('o-'+v).textContent=e.value});
function load(){fetch(B+'/status').then(r=>r.json()).then(s=>{for(const v in s){const e=$('c-'+v);if(!e)continue;if(e.type=='checkbox')e.checked=!!s[v];else e.value=s[v];const o=$('o-'+v);if(o&&e.type=='range')o.textContent=s[v]}$('xclk').value=s.xclk;dep();
$('st').textContent=s.streaming?'streaming '+s.fps+' fps':'idle';$('st').className='pill'+(s.streaming?' on':'')}).catch(()=>{$('m').textContent='camera not reachable'})}
fetch(B+'/api/system/info').then(r=>r.json()).then(d=>$('host').textContent=d.identity.hostName).catch(()=>{});
let on=0,url='';
$('still').onclick=()=>{stop();fetch(B+'/capture?_='+Date.now()).then(r=>r.blob()).then(b=>{if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(b);$('view').innerHTML='<img src="'+url+'">';$('save-img').href=url;$('save-img').style.display='';$('info').textContent=(b.size/1024).toFixed(0)+' KB'})};
function stop(){if(on){$('view').innerHTML='<span>stopped</span>';on=0;$('strm').textContent='Start stream';setTimeout(load,500)}}
$('strm').onclick=()=>{if(on)return stop();$('view').innerHTML='<img src="'+S+'">';on=1;$('strm').textContent='Stop stream';$('save-img').style.display='none';setTimeout(load,2500)};
$('sv').onclick=()=>fetch(B+'/api/camera/save',{method:'POST'}).then(r=>r.json()).then(j=>$('m').textContent=j.status=='ok'?'saved':'save failed');$('rl').onclick=load;
$('xs').onclick=()=>fetch(B+'/xclk?xclk='+$('xclk').value).then(r=>$('rm').textContent=r.ok?'xclk set':'rejected');
const rp=()=>{const[m,v]=$('rmv').value.split('/').map(x=>parseInt(x.trim()));return{r:parseInt($('rg').value),m:isNaN(m)?255:m,v}};
$('rget').onclick=()=>{const p=rp();fetch(B+'/greg?reg='+p.r+'&mask='+p.m).then(r=>r.text()).then(t=>$('rm').textContent='= '+t+' (0x'+(+t).toString(16)+')')};
$('rset').onclick=()=>{const p=rp();if(isNaN(p.v))return;fetch(B+'/reg?reg='+p.r+'&mask='+p.m+'&val='+p.v).then(r=>$('rm').textContent=r.ok?'written':'rejected')};
load();setInterval(()=>{if(on)load()},5000);
</script></body></html>
