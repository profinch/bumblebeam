<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="g" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#0b76ff"/><stop offset="1" stop-color="#39fff2"/></linearGradient>
    <clipPath id="c"><rect x="9.5" y="13.5" width="15" height="9" rx="4.5"/></clipPath>
  </defs>
  <!-- Beam's hexagon and gradient -->
  <path d="M16 2 28 9v14L16 30 4 23V9z" fill="url(#g)"/>
  <!-- the beam: a light trail behind the bee -->
  <g stroke="#fff" stroke-width="1.3" stroke-linecap="round">
    <path d="M4.5 20h3.5" stroke-opacity=".6"><animate attributeName="stroke-opacity" values=".25;.85;.25" dur="1.5s" repeatCount="indefinite"/></path>
    <path d="M3.5 23.5h2.5" stroke-opacity=".6"><animate attributeName="stroke-opacity" values=".85;.25;.85" dur="1.5s" repeatCount="indefinite"/></path>
  </g>
  <!-- wings -->
  <ellipse cx="14.5" cy="10.8" rx="3.6" ry="2.1" fill="#fff" fill-opacity=".9" stroke="#042548" stroke-width=".6" transform="rotate(-24 14.5 10.8)">
    <animateTransform attributeName="transform" type="rotate" values="-32 14.5 12.9;-16 14.5 12.9;-32 14.5 12.9" dur=".44s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="20" cy="10.8" rx="3.6" ry="2.1" fill="#fff" fill-opacity=".9" stroke="#042548" stroke-width=".6" transform="rotate(24 20 10.8)">
    <animateTransform attributeName="transform" type="rotate" values="16 20 12.9;32 20 12.9;16 20 12.9" dur=".44s" repeatCount="indefinite"/>
  </ellipse>
  <!-- bumblebee body with stripes -->
  <rect x="9.5" y="13.5" width="15" height="9" rx="4.5" fill="#042548"/>
  <g clip-path="url(#c)" fill="#f4ce4a"><rect x="13.3" y="13" width="3" height="10"/><rect x="18.6" y="13" width="3" height="10"/></g>
  <circle cx="22.6" cy="17" r=".95" fill="#39fff2"/>
</svg>
