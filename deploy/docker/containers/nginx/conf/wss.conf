# wss.bumblebeam.org: bumblebeam's WebSockets, one name, one service per path.
#   /   beam-node for browser wallets (the BumbleBeam Bridge extension, bridge/). Beam's wasm wallet
#       cannot open TCP, so it speaks the node protocol over wss://host:443/, and only at the root:
#       the wasm build prefixes the address with wss:// and takes no path. beam-node
# itself runs the WebSocket-to-TCP proxy (websocket_port=8200, websocket_use_tls=0, on
# 127.0.0.1 only); nginx adds TLS. The node answers what any public node answers; keys stay in
# the wallet.
#   other paths: free for later (pool or explorer live events); 404 until then

# a browser wallet keeps one connection; a few spare per address, then 503
limit_conn_zone $binary_remote_addr zone=wallet_node:10m;

# only extension pages may connect, not any website a visitor happens to open
map $http_origin $wallet_node_origin_ok {
    ~^chrome-extension://   1;
    default                 0;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name wss.bumblebeam.org;

    ssl_certificate     /etc/letsencrypt/live/bumblebeam.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bumblebeam.org/privkey.pem;

    access_log /var/log/nginx/wss.access.log;

    location = / {
        if ($wallet_node_origin_ok = 0) { return 403; }
        limit_conn wallet_node 4;
        proxy_pass http://127.0.0.1:8200;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # Cloudflare closes idle WebSockets after 100 s; the wallet pings more often than that
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / { return 404; }
}
