# pool.bumblebeam.org: the pool's web UI and API (bumblebeam-pool on 127.0.0.1:8080).
# bumblebeam.org and www have no site of their own yet and point to the pool.
# nginx runs in the host network, so the host firewall decides who reaches 80/443
# (Cloudflare only). One Let's Encrypt certificate, bumblebeam.org + *.bumblebeam.org.

# The pool's API runs in the pool process itself (next to stratum): limit it per client.
# $binary_remote_addr is the real client here (cloudflare-realip.conf).
limit_req_zone $binary_remote_addr zone=pool_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name bumblebeam.org www.bumblebeam.org pool.bumblebeam.org explorer.bumblebeam.org;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bumblebeam.org www.bumblebeam.org;

    ssl_certificate     /etc/letsencrypt/live/bumblebeam.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bumblebeam.org/privkey.pem;

    # temporary (302) until bumblebeam.org has a site of its own
    return 302 https://pool.bumblebeam.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pool.bumblebeam.org;

    ssl_certificate     /etc/letsencrypt/live/bumblebeam.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bumblebeam.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # The UI has no build step and no versioned file names: make Cloudflare and browsers
    # revalidate, so a release shows up at once instead of after their 4 h default.
    add_header Cache-Control "no-cache" always;

    # /api alone is the UI's API-docs page (without this, nginx would redirect it to /api/)
    location = /api {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
    }
    # the pool's API; the pages come from pool-web, so UI releases never restart the pool
    location /api/ {
        limit_req zone=pool_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
    # the pool's MCP server (pool-web passes it on to explorer-api)
    location = /mcp {
        limit_req zone=pool_api burst=40 nodelay;
        limit_req_status 429;
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}

# explorer.bumblebeam.org: the block explorer (explorer-web on 127.0.0.1:8090)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name explorer.bumblebeam.org;

    ssl_certificate     /etc/letsencrypt/live/bumblebeam.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bumblebeam.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}

# anything else (direct IP, unknown names): drop the connection
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
    return 444;
}
