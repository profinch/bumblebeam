# Nginx access logs
/var/log/nginx/*access.log /var/log/nginx/*/*access.log {
  daily
  dateext
  dateformat _%Y-%m-%d
  extension .log
  missingok
  rotate 60
  notifempty
  compress
  delaycompress
  create 0644 nginx nginx
  sharedscripts
  postrotate
    if [ -f /var/run/nginx.pid ]; then
      kill -USR1 `cat /var/run/nginx.pid`
    fi
  endscript
}

# Nginx error logs
/var/log/nginx/*error.log /var/log/nginx/*/*error.log {
  daily
  dateext
  dateformat _%Y-%m-%d
  extension .log
  missingok
  rotate 60
  notifempty
  compress
  delaycompress
  create 0644 nginx nginx
  sharedscripts
  postrotate
    if [ -f /var/run/nginx.pid ]; then
      kill -USR1 `cat /var/run/nginx.pid`
    fi
  endscript
}

# Cron logs
/var/log/nginx/cron.log {
  weekly
  dateext
  dateformat _%Y-%m-%d
  extension .log
  missingok
  rotate 60
  notifempty
  compress
  delaycompress
  create 0644 root root
}

