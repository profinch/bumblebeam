# Inside the puzzle-web container. The host nginx proxies puzzle.bumblebeam.org here. Cloudflare's CF-Connecting-IP
# reaches the API as it came (nginx passes a request's headers on): the API keys its limits on it.
limit_req_zone $http_cf_connecting_ip zone=puzzle_api:10m rate=10r/s;

# Files asked for with the release's version (?v=<release>, set by the Dockerfile in every page) never change under
# that URL: cached for a year without asking again. Only files (a .js, .css, .svg, .png, .woff2…): a page asked for
# with any ?v= is still asked again every time, as is anything unversioned.
map $uri $puzzle_file {
    ~*\.(js|css|svg|png|jpg|webp|ico|woff2?)$ 1;
    default 0;
}
map "$puzzle_file:$arg_v" $puzzle_cache {
    "1:"     "no-cache";
    "1:dev"  "no-cache";
    ~^1:.    "public, max-age=31536000, immutable";
    default  "no-cache";
}

# a searcher's page (/pool/<address>) is one person's numbers: kept out of search results (an empty
# value sends no header). robots.txt leaves it open, so a crawler can see this and drop the page. By the address
# asked for: $uri is /searcher.html by the time the header is written
map $request_uri $puzzle_robots {
    ~^/pool/  "noindex";
    ~^/_tpl/  "noindex";
    default   "";
}
# the pages with live numbers: puzzle-api writes them into the page (api/pages.js), and where the page is
map $uri $puzzle_ssr {
    /                          /api/page/index;
    ~^/(pool|bench|proof)$     /api/page/$1;
    ~^/puzzle/(\d+)$           /api/page/puzzle/$1;
    default                    "";
}
map $uri $puzzle_page {
    /                          index.html;
    ~^/(pool|bench|proof)$     $1.html;
    default                    "";
}

server {
    listen 8080;
    root /usr/share/nginx/html;
    absolute_redirect off;
    gzip on;
    gzip_min_length 1024;
    # a file with a .gz beside it (made by the Dockerfile at -9) is sent as that file; the API's answers are still
    # gzipped as they go. Vary: a cache in between keeps the gzipped and the plain answer apart
    gzip_static on;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;
    # These headers are on every response but the API's (a location with its own add_header drops the server's).
    # The policy: scripts only from this site (there are no inline scripts or handlers), requests only to this site
    # and what a find needs (the two explorers, MARA Slipstream, the OpenTimestamps calendars), no framing by other sites.
    # The finder's key waits in this origin's storage: a script slipped into a page must neither run nor send it out.
    # tests/serve.js serves the same policy, so the browser tests run under it.
    add_header Cache-Control $puzzle_cache always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://mempool.space https://blockstream.info https://slipstream.mara.com https://a.pool.opentimestamps.org https://b.pool.opentimestamps.org https://a.pool.eternitywall.com https://finney.calendar.eternitywall.com; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag $puzzle_robots always;

    # unknown paths: a real 404 with the site's own page
    error_page 404 /404.html;
    location = /404.html { internal; }

    # the API (puzzle-api); resolved per request, so nginx starts while it is down
    # benchmark results: GET the table, POST a run
    location = /api/bench {
        limit_except GET HEAD POST { deny all; }
        limit_req zone=puzzle_api burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 4k;
        resolver 127.0.0.11 valid=30s;
        set $api puzzle-api:8080;
        proxy_pass http://$api;
        proxy_read_timeout 30s;
    }
    # a benchmark run's proof: a challenge (hidden keys in a range), then the keys found (exact matches, as below)
    location = /api/bench/challenge {
        limit_except POST { deny all; }
        limit_req zone=puzzle_api burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 4k;
        resolver 127.0.0.11 valid=30s;
        set $api puzzle-api:8080;
        proxy_pass http://$api;
        proxy_read_timeout 30s;
    }
    location = /api/bench/check {
        limit_except POST { deny all; }
        limit_req zone=puzzle_api burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 4k;
        resolver 127.0.0.11 valid=30s;
        set $api puzzle-api:8080;
        proxy_pass http://$api;
        proxy_read_timeout 30s;
    }
    # the shared search: leases, reports, releases. Exact matches: the ^~ /api/ prefix below would win over
    # any regex location (that sent every POST there, to a 403)
    location = /api/pool/lease {
        limit_except POST { deny all; }
        limit_req zone=puzzle_api burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 8k;
        add_header X-Robots-Tag "noindex" always;
        resolver 127.0.0.11 valid=30s;
        set $api puzzle-api:8080;
        proxy_pass http://$api;
        proxy_read_timeout 30s;
    }
    location = /api/pool/report {
        limit_except POST { deny all; }
        limit_req zone=puzzle_api burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 8k;
        add_header X-Robots-Tag "noindex" always;
        resolver 127.0.0.11 valid=30s;
        set $api puzzle-api:8080;
        proxy_pass http://$api;
        proxy_read_timeout 30s;
    }
    location = /api/pool/release {
        limit_except POST { deny all; }
        limit_req zone=puzzle_api burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 8k;
        add_header X-Robots-Tag "noindex" always;
        resolver 127.0.0.11 valid=30s;
        set $api puzzle-api:8080;
        proxy_pass http://$api;
        proxy_read_timeout 30s;
    }
    location = /api/pool/ping {
        limit_except POST { deny all; }
        limit_req zone=puzzle_api burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 8k;
        add_header X-Robots-Tag "noindex" always;
        resolver 127.0.0.11 valid=30s;
        set $api puzzle-api:8080;
        proxy_pass http://$api;
        proxy_read_timeout 30s;
    }
    # a found key: POST the find (the key, the salt, the commitment, the signed transactions: up to 1 MB, a puzzle
    # address can hold many small coins; sealed, web/engine/seal.js, a third more)
    location = /api/pool/found {
        limit_except POST { deny all; }
        limit_req zone=puzzle_api burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 2m;
        add_header X-Robots-Tag "noindex" always;
        resolver 127.0.0.11 valid=30s;
        set $api puzzle-api:8080;
        proxy_pass http://$api;
        proxy_read_timeout 60s;
    }
    # a key found outside the pool's pieces (/play, the home page's lucky key), kept by the server: POST { key, ... }
    location = /api/pool/solo {
        limit_except POST { deny all; }
        limit_req zone=puzzle_api burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 128k;
        add_header X-Robots-Tag "noindex" always;
        resolver 127.0.0.11 valid=30s;
        set $api puzzle-api:8080;
        proxy_pass http://$api;
        proxy_read_timeout 60s;
    }
    # what the server made of a find: POST { lease } (the lease in the body, never in a logged address)
    location = /api/pool/found/status {
        limit_except POST { deny all; }
        limit_req zone=puzzle_api burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        add_header X-Robots-Tag "noindex" always;
        resolver 127.0.0.11 valid=30s;
        set $api puzzle-api:8080;
        proxy_pass http://$api;
        proxy_read_timeout 30s;
    }
    # the pool's live numbers: one long-lived event stream per open page, never buffered
    location = /api/pool/live {
        limit_except GET HEAD { deny all; }
        add_header X-Robots-Tag "noindex" always;
        resolver 127.0.0.11 valid=30s;
        set $api puzzle-api:8080;
        proxy_pass http://$api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
    location ^~ /api/ {
        limit_except GET HEAD { deny all; }
        limit_req zone=puzzle_api burst=30 nodelay;
        limit_req_status 429;
        add_header X-Robots-Tag "noindex" always;
        resolver 127.0.0.11 valid=30s;
        set $api puzzle-api:8080;
        proxy_pass http://$api;
        proxy_read_timeout 30s;
    }
    # one address per page: /learn/ is /learn (the API's prefix above is matched before this)
    location ~ ^(/.+)/$ { return 301 $1$is_args$args; }
    location = /index.html { return 301 /; }
    # the pages with live numbers: puzzle-api writes them in before the page is sent (a crawler without JavaScript and
    # every first paint get them); it takes the page's own HTML from /_tpl/ below. With the API down or slow, the page
    # as it is (its loaders, the numbers drawn by its script as before)
    location ~ ^/(pool|bench|proof)?$ {
        resolver 127.0.0.11 valid=30s;
        set $api puzzle-api:8080;
        proxy_pass http://$api$puzzle_ssr;
        proxy_connect_timeout 1s;
        proxy_read_timeout 4s;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = /_tpl/$puzzle_page;
    }
    # one page for each puzzle; an unknown number is the site's 404, and without the API the page says so to a
    # crawler (503: come back later) while a visitor still gets it, filled by its script
    location ~ "^/puzzle/([1-9][0-9]{0,2})$" {
        resolver 127.0.0.11 valid=30s;
        set $api puzzle-api:8080;
        proxy_pass http://$api$puzzle_ssr;
        proxy_connect_timeout 1s;
        proxy_read_timeout 4s;
        proxy_intercept_errors on;
        error_page 404 /404.html;
        error_page 500 502 503 504 =503 /_tpl/puzzle.html;
    }
    # the pages' own HTML, as files: puzzle-api's templates, and the fallback above
    location ^~ /_tpl/ { alias /usr/share/nginx/html/; }
    location ~ ^/(play|learn|rules)$ { try_files /$1.html =404; }
    # a searcher's page: /pool/<their address>
    location ~ "^/pool/[A-Za-z0-9]{25,90}$" { try_files /searcher.html =404; }
    location = /searcher.html { return 301 /pool; }
    location ~ ^/(pool|play|learn|bench|rules|proof)\.html$ { return 301 /$1; }
    location = /puzzle.html { return 301 /; }
    location / { try_files $uri =404; }
}
