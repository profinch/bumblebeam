# Inside the puzzle-web container. The host nginx proxies puzzle.bumblebeam.org here.
limit_req_zone $http_cf_connecting_ip zone=puzzle_api:10m rate=10r/s;

server {
    listen 8080;
    root /usr/share/nginx/html;
    absolute_redirect off;
    add_header Cache-Control "no-cache" always;

    error_page 404 /index.html;

    # the API (puzzle-api), read-only; resolved per request, so nginx starts while it is down
    # benchmark results are the one thing visitors send
    location = /api/bench {
        limit_except GET HEAD POST { deny all; }
        limit_req zone=puzzle_api burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 4k;
        resolver 127.0.0.11 valid=30s;
        set $api puzzle-api:8080;
        proxy_pass http://$api;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 30s;
    }
    location ^~ /api/ {
        limit_except GET HEAD { deny all; }
        limit_req zone=puzzle_api burst=30 nodelay;
        limit_req_status 429;
        add_header X-Robots-Tag "noindex" always;
        resolver 127.0.0.11 valid=30s;
        set $api puzzle-api:8080;
        proxy_pass http://$api;
        proxy_read_timeout 30s;
    }
    location = /index.html { return 301 /; }
    location = / { try_files /index.html =404; }
    location ~ ^/(play|learn|bench)$ { try_files /$1.html =404; }
    location ~ ^/(play|learn|bench)\.html$ { return 301 /$1; }
    location / { try_files $uri =404; }
}
