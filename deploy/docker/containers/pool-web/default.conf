# Inside the pool-web container. The host nginx sends pool.bumblebeam.org here, except /api/*.

# Pages that are someone's data (a miner, a block's split) or the operator's: shown, not indexed.
# By the request as sent, so the 404 page and the snapshots do not change it.
map $request_uri $bb_robots {
    ~^/(miners|payments)(/|\?|$)  "noindex";
    ~^/blocks/                    "noindex";
    ~^/(dash|mcp)(\?|$)           "noindex";
    default                       "";
}

server {
    listen 8080;
    root /usr/share/nginx/html;
    # redirects stay relative: this nginx sits behind the host's, on an internal port
    absolute_redirect off;

    # The public pages share the origin (and its localStorage, where /dash keeps the token) with /dash:
    # only our own scripts run here too, and the page may talk only to the hosts it reads (audit 2026-10-23).
    # Set here for every location that adds no headers of its own.
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://explorer.bumblebeam.org https://beamterminal.0xmx.net https://explorer.0xmx.net https://raw.githubusercontent.com; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    # an empty value sends no header
    add_header X-Robots-Tag $bb_robots always;

    # Unknown paths are a real 404 (not the app with a 200), shown as the app's own "not found" page.
    # try_files ends in =404 everywhere: a last plain argument would be an internal redirect, and
    # /index.html redirects to /.
    error_page 404 /_404;
    location = /_404 {
        internal;
        try_files /index.html =404;
    }

    # the pool's MCP server (pool_* tools), run by explorer-api next to the explorer's
    location = /mcp {
        client_max_body_size 1m;
        resolver 127.0.0.11 valid=30s;
        set $api explorer-api:8080;
        rewrite ^ /mcp/pool break;
        proxy_pass http://$api;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # the operator's dashboard: a page of its own, it talks to /api/admin/* with a token
    location = /dash {
        try_files /dash.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex" always;
        # the page holds the operator's token: only its own scripts run, and no other site may frame it
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options DENY always;
    }
    location = /dash.html { return 301 /dash; }
    location = /dash.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Prerendered snapshots (the prerender container writes them every 10 minutes into this volume):
    # the same page every visitor gets, already filled, which app.js then keeps live. Without a
    # snapshot a page is the bare app, as before. Not reachable by their own paths.
    location ^~ /_snap/ { internal; }
    location = /sitemap.xml { try_files /_snap/sitemap.xml =404; }
    location = /index.html { return 301 /; }

    # the app's pages (app.js views), each with its snapshot when there is one
    location = / { try_files /_snap/index.html /index.html =404; }
    location ~ ^/(network|blocks|miners|payments|connect|api)$ { try_files /_snap/$1.html /index.html =404; }
    # one miner, one block's split: the app alone
    location ~ ^/(miners|blocks)/[^/]+$ { try_files /index.html =404; }
    # /network/ and the like: one URL per page
    location ~ ^(/.+)/$ { return 301 $1$is_args$args; }

    # files (app.js, styles.css, robots.txt, ...); anything else is a 404
    location / {
        try_files $uri =404;
    }
}
