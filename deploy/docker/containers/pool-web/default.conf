# Inside the pool-web container. The host nginx sends pool.bumblebeam.org here, except /api/*.
server {
    listen 8080;
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache" always;

    # clean paths (/network, /miners/<address>, /api): anything that is not a file is the app
    location / {
        try_files $uri /index.html;
    }
}
