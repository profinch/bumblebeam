# Inside the pool-web container. The host nginx sends pool.bumblebeam.org here, except /api/*.
server {
    listen 8080;
    root /usr/share/nginx/html;
    # redirects stay relative: this nginx sits behind the host's, on an internal port
    absolute_redirect off;
    add_header Cache-Control "no-cache" always;

    # the MCP server (the same one as on explorer.bumblebeam.org: explorer and pool tools)
    location = /mcp {
        client_max_body_size 1m;
        resolver 127.0.0.11 valid=30s;
        set $api explorer-api:8080;
        proxy_pass http://$api;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # clean paths (/network, /miners/<address>, /api): anything that is not a file is the app
    location / {
        try_files $uri /index.html;
    }
}
