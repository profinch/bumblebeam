# Inside the explorer-web container. The host nginx proxies explorer.bumblebeam.org here.
limit_req_zone $http_cf_connecting_ip zone=explorer_api:10m rate=20r/s;

server {
    listen 8080;
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache" always;

    # explorer-node's HTTP API, read-only, behind /api/. Resolved per request, so nginx
    # starts even while explorer-node is down.
    location /api/ {
        limit_except GET HEAD { deny all; }
        limit_req zone=explorer_api burst=40 nodelay;
        resolver 127.0.0.11 valid=30s;
        set $explorer explorer-node:8888;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$explorer;
        proxy_read_timeout 30s;
    }

    # clean paths (/block/123, /kernel/<id>): anything that is not a file is the app
    location / {
        try_files $uri /index.html;
    }
}
