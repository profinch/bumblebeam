# Inside the explorer-web container. The host nginx proxies explorer.bumblebeam.org here.
limit_req_zone $http_cf_connecting_ip zone=explorer_api:10m rate=20r/s;

# Single blocks, kernels and contracts are millions of thin pages (Google crawled 150k blocks in a
# week of October 2026), filtered lists and peers are no pages of their own, and the APIs are JSON:
# shown, not indexed. By the request as sent, so the 404 page and the snapshots do not change it.
map $request_uri $bb_robots {
    ~^/(block|kernel|contract)/      "noindex";
    ~^/(assets|names)/               "noindex";
    ~^/peers(\?|$)                   "noindex";
    ~^/(api/|v1|mcp)                 "noindex";
    default                          "";
}

# The prerenderer asks for ?prerender=1 and gets the bare app, never an older snapshot: otherwise a
# snapshot's header and footer (outside what app.js redraws) would outlive every release.
map $arg_prerender $bb_snap {
    "1"      "/_bare";
    default  "/_snap";
}

server {
    listen 8080;
    root /usr/share/nginx/html;
    # redirects stay relative: this nginx sits behind the host's, on an internal port
    absolute_redirect off;
    add_header Cache-Control "no-cache" always;
    # an empty value sends no header
    add_header X-Robots-Tag $bb_robots always;

    # Unknown paths are a real 404 (not the app with a 200), shown as the app's own "not found" page.
    # try_files ends in =404 everywhere: a last plain argument would be an internal redirect, and
    # /index.html redirects to /.
    error_page 404 /_404;
    location = /_404 {
        internal;
        try_files /index.html =404;
    }

    # explorer-node's HTTP API, read-only, behind /api/. Resolved per request, so nginx
    # starts even while explorer-node is down.
    location ^~ /api/ {
        limit_except GET HEAD { deny all; }
        limit_req zone=explorer_api burst=40 nodelay;
        limit_req_status 429;
        resolver 127.0.0.11 valid=30s;
        set $explorer explorer-node:8888;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$explorer;
        proxy_read_timeout 30s;
    }

    # the BumbleBeam API (plain JSON) and the MCP server, in the explorer-api container
    # /api alone is the UI's API docs page; /api/... is explorer-node
    location = /api {
        try_files $bb_snap/api.html /index.html =404;
    }
    location = /v1 {
        resolver 127.0.0.11 valid=30s;
        set $api explorer-api:8080;
        proxy_pass http://$api;
    }
    location ^~ /v1/ {
        limit_except GET HEAD { deny all; }
        limit_req zone=explorer_api burst=40 nodelay;
        limit_req_status 429;
        resolver 127.0.0.11 valid=30s;
        set $api explorer-api:8080;
        proxy_pass http://$api;
        proxy_read_timeout 90s;
    }
    location = /mcp {
        limit_req zone=explorer_api burst=40 nodelay;
        limit_req_status 429;
        client_max_body_size 1m;
        resolver 127.0.0.11 valid=30s;
        set $api explorer-api:8080;
        proxy_pass http://$api;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # Prerendered snapshots (the prerender container writes them into this volume): the same page
    # every visitor gets, already filled, which app.js then keeps live. Without a snapshot a page is
    # the bare app, as before. Not reachable by their own paths.
    location ^~ /_snap/ { internal; }
    location = /sitemap.xml { try_files /_snap/sitemap.xml =404; }
    location = /index.html { return 301 /; }

    # the app's pages (app.js views), each with its snapshot when there is one
    location = / { try_files $bb_snap/index.html /index.html =404; }
    location ~ ^/(assets|contracts|dex|names|peers)$ { try_files $bb_snap/$1.html /index.html =404; }
    location ~ "^/asset/(\d{1,10})$" { try_files $bb_snap/asset/$1.html /index.html =404; }
    # one block, kernel, contract, or a filtered list: the app alone
    location ~ ^/(block|kernel|asset|contract|assets|names)/[^/]+$ { try_files /index.html =404; }
    # /assets/ and the like: one URL per page
    location ~ ^(/.+)/$ { return 301 $1$is_args$args; }

    # files (app.js, explorer.css, robots.txt, ...); anything else is a 404
    location / {
        try_files $uri =404;
    }
}
