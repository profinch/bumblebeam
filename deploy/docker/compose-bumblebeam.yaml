# BumbleBeam pool: Beam node, wallet-api, PostgreSQL and the pool.
# Lives in /data/docker; persistent data in /data/bumblebeam (owned by uid 10001):
#   node/      node.db, beam-node.cfg, secrets/ (stratum TLS + api key)
#   wallet/    wallet.db, wallet.pass
#   pool/      pool.toml, database.url, tls/   (mounted at /etc/bumblebeam)
#   postgres/  database files;  secrets/postgres.pass
#   letsencrypt/  certificates (certbot, Cloudflare DNS-01);  logs/
#   docker compose -f compose-bumblebeam.yaml up -d --build

services:
  beam-node:
    image: bumblebeam-beam
    container_name: beam-node
    hostname: beam-node
    build: ./containers/beam
    restart: unless-stopped
    command: ["beam-node", "--config_file=/data/beam-node.cfg"]
    working_dir: /data
    ports:
      - "10000:10000"                     # p2p, the node is a full peer
      - "127.0.0.1:8200:8200"             # WebSocket for browser wallets, behind nginx (wss.conf)
    volumes:
      - /data/bumblebeam/node:/data
    ulimits:
      nofile: 65536
    stop_grace_period: 60s
    networks:
      - bumblebeam

  # The explorer's data: a second full node with Beam's HTTP explorer API on 8888,
  # syncing from our archival node over the compose network. Published nowhere;
  # explorer-web proxies the read-only API.
  explorer-node:
    image: bumblebeam-beam
    container_name: explorer-node
    hostname: explorer-node
    restart: unless-stopped
    command: ["explorer-node", "--config_file=/data/explorer-node.cfg"]
    working_dir: /data
    volumes:
      - /data/bumblebeam/explorer:/data
    ulimits:
      nofile: 65536
    stop_grace_period: 60s
    depends_on:
      - beam-node
    networks:
      - bumblebeam

  # pool.bumblebeam.org's pages, apart from the pool, so UI releases leave stratum alone.
  pool-web:
    image: bumblebeam-pool-web
    container_name: pool-web
    hostname: pool-web
    build:
      context: ./containers/pool-web
      args:
        BUMBLEBEAM_REF: ${POOL_WEB_REF:-${BUMBLEBEAM_REF:-main}}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8091:8080"             # for the host nginx
    volumes:
      - /data/bumblebeam/snap/pool:/usr/share/nginx/html/_snap:ro   # from prerender
    networks:
      - bumblebeam

  # The BumbleBeam API (/v1, plain JSON for bots) and the MCP server (/mcp, for agents), over
  # explorer-node and the pool; explorer-web proxies both. Published nowhere.
  explorer-api:
    image: bumblebeam-explorer-api
    container_name: explorer-api
    hostname: explorer-api
    build:
      context: ./containers/explorer-api
      args:
        BUMBLEBEAM_REF: ${BUMBLEBEAM_REF:-main}
    restart: unless-stopped
    environment:
      EXPLORER_URL: http://explorer-node:8888
      POOL_URL: http://pool:8080
      PUBLIC_URL: https://explorer.bumblebeam.org
    networks:
      - bumblebeam

  # explorer.bumblebeam.org: the explorer UI and a read-only proxy to explorer-node's API.
  explorer-web:
    image: bumblebeam-explorer-web
    container_name: explorer-web
    hostname: explorer-web
    build:
      context: ./containers/explorer-web
      args:
        BUMBLEBEAM_REF: ${BUMBLEBEAM_REF:-main}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8080"             # for the host nginx
    volumes:
      - /data/bumblebeam/snap/explorer:/usr/share/nginx/html/_snap:ro   # from prerender
    depends_on:
      - explorer-node
    networks:
      - bumblebeam

  # Prerendered pages: headless Chromium fills each indexable page of the pool and the explorer
  # through the host nginx every 10 minutes and saves the HTML for pool-web and explorer-web to
  # serve, so search engines and AI crawlers that run no JavaScript read the page with its data.
  # Stopping it changes nothing for visitors: old snapshots expire and the sites are the bare app.
  prerender:
    image: bumblebeam-prerender
    container_name: prerender
    build:
      context: ./containers/prerender
    restart: unless-stopped
    network_mode: host                  # reaches the host nginx on 127.0.0.1:443
    init: true                          # reaps Chromium's processes
    mem_limit: 1g
    volumes:
      - /data/bumblebeam/snap:/snap
    logging:
      driver: journald
      options:
        tag: bumblebeam-prerender

  # Payouts. Anyone who can reach 10001 can spend the wallet: it is on its own
  # internal network, published nowhere, and only answers the pool's address.
  wallet-api:
    image: bumblebeam-beam
    container_name: wallet-api
    hostname: wallet-api
    restart: unless-stopped
    entrypoint: ["bash", "-c"]
    # --enable_lelantus: payouts to offline addresses are push (shielded) transactions, which
    # wallet-api refuses without it ("Unsupported type of transaction: 7")
    command:
      - >-
        exec wallet-api --node_addr=beam-node:10000 --wallet_path=/data/wallet.db
        --pass="$$(cat /data/wallet.pass)" --port=10001 --use_http=1
        --ip_whitelist=172.30.1.10 --log_level=info
        --enable_lelantus
    working_dir: /data
    volumes:
      - /data/bumblebeam/wallet:/data
    depends_on:
      - beam-node
    networks:
      bumblebeam:                         # to reach the node
      wallet:
        ipv4_address: 172.30.1.2          # the pool calls this address, not the name:
                                          # the name may resolve on the other network

  postgres:
    image: postgres:17-trixie
    container_name: bumblebeam-postgres
    hostname: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bumblebeam
      POSTGRES_DB: bumblebeam
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres.pass
    volumes:
      - /data/bumblebeam/postgres:/var/lib/postgresql/data
      - /data/bumblebeam/secrets/postgres.pass:/run/secrets/postgres.pass:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bumblebeam -d bumblebeam"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - bumblebeam

  # The pool in two processes from one image (docs/pool-split.md): pool-stratum holds the miners' connections
  # and changes rarely; pool-app (API, admin, payouts, maturity) takes most releases without dropping a miner.
  # Both read the same pool.toml; the app reaches the stratum process's control interface on pool-stratum:8081.
  # The host's journal keeps their logs across rebuilds: journalctl CONTAINER_NAME=bumblebeam-pool-stratum (or -app).
  # POOL_REF (a commit) picks the source and tags the image, so a rollback is POOL_REF=<previous> + up -d.
  pool-stratum:
    image: bumblebeam-pool:${POOL_REF:?set POOL_REF in .env}
    container_name: bumblebeam-pool-stratum
    hostname: pool-stratum
    build:
      context: ./containers/pool
      args:
        BUMBLEBEAM_REF: ${POOL_REF}
    command: ["run", "stratum"]
    restart: unless-stopped
    # the graceful stop: connections, the share queue, a block being credited
    stop_grace_period: 30s
    ports:
      - "3333-3334:3333-3334"             # stratum PPLNS / solo
      - "3443-3444:3443-3444"             # stratum TLS PPLNS / solo
    volumes:
      - /data/bumblebeam/pool:/etc/bumblebeam:ro
    ulimits:
      nofile: 65536
    logging:
      driver: journald
      options:
        tag: bumblebeam-pool-stratum
    depends_on:
      postgres:
        condition: service_healthy
      beam-node:
        condition: service_started
    networks:
      - bumblebeam

  pool-app:
    image: bumblebeam-pool:${POOL_REF:?set POOL_REF in .env}
    container_name: bumblebeam-pool-app
    hostname: pool-app
    command: ["run", "app"]
    restart: unless-stopped
    # the graceful stop: a payout in hand finishes
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:8080:8080"             # the API, for the host nginx
    volumes:
      - /data/bumblebeam/pool:/etc/bumblebeam:ro
    logging:
      driver: journald
      options:
        tag: bumblebeam-pool-app
    healthcheck:
      # /api/health is 200 when the node view is fresh and the stratum process answers
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /api/health HTTP/1.0\r\n\r\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      pool-stratum:
        condition: service_started
    networks:
      bumblebeam:
        aliases: [pool]                   # explorer-api's POOL_URL http://pool:8080 keeps working
      wallet:
        ipv4_address: 172.30.1.10         # the only address wallet-api answers (payouts are the app's)

  # Web: pool.bumblebeam.org (and bumblebeam.org, www) through Cloudflare. Host
  # network, so the host firewall (Cloudflare ranges only on 80/443) applies; it
  # sends the pool's /api/ to pool-app on 127.0.0.1:8080 and its pages to pool-web
  # on 127.0.0.1:8091. Same image as on h1: cron runs
  # nginx-reload.sh daily at 04:00, which reloads when certbot left a trigger.
  nginx:
    image: bumblebeam-nginx
    container_name: bumblebeam-nginx
    build: ./containers/nginx
    restart: unless-stopped
    network_mode: host
    environment:
      - HOST_HOSTNAME=${HOST_HOSTNAME:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    volumes:
      - ./containers/nginx/conf:/etc/nginx/conf.d:ro
      - /data/bumblebeam/letsencrypt:/etc/letsencrypt
      - /data/bumblebeam/logs/nginx:/var/log/nginx
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - pool-app

  # Let's Encrypt for bumblebeam.org + *.bumblebeam.org over Cloudflare DNS-01,
  # same scripts as on h1: checked at start and daily at 03:00 UTC.
  certbot:
    image: bumblebeam-certbot
    container_name: bumblebeam-certbot
    build: ./containers/certbot
    restart: unless-stopped
    environment:
      - HOST_HOSTNAME=${HOST_HOSTNAME:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - TZ=UTC
    volumes:
      - ./containers/certbot/config.json:/app/config.json:ro
      - /data/bumblebeam/logs/certbot:/var/log/certbot
      - /data/bumblebeam/letsencrypt:/etc/letsencrypt
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: "5"

networks:
  bumblebeam:
    name: bumblebeam
  wallet:
    name: bumblebeam-wallet
    internal: true
    ipam:
      config:
        - subnet: 172.30.1.0/24
