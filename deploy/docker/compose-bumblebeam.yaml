# BumbleBeam pool: Beam node, wallet-api, PostgreSQL and the pool.
# Lives in /data/docker; persistent data in /data/bumblebeam (owned by uid 10001):
#   node/      node.db, beam-node.cfg, secrets/ (stratum TLS + api key)
#   wallet/    wallet.db, wallet.pass
#   pool/      pool.toml, database.url, tls/   (mounted at /etc/bumblebeam)
#   postgres/  database files;  secrets/postgres.pass
#   letsencrypt/  certificates (certbot, Cloudflare DNS-01);  logs/
#   docker compose -f compose-bumblebeam.yaml up -d --build

services:
  beam-node:
    image: bumblebeam-beam
    container_name: beam-node
    hostname: beam-node
    build: ./containers/beam
    restart: unless-stopped
    command: ["beam-node", "--config_file=/data/beam-node.cfg"]
    working_dir: /data
    ports:
      - "10000:10000"                     # p2p, the node is a full peer
    volumes:
      - /data/bumblebeam/node:/data
    ulimits:
      nofile: 65536
    stop_grace_period: 60s
    networks:
      - bumblebeam

  # Payouts. Anyone who can reach 10001 can spend the wallet: it is on its own
  # internal network, published nowhere, and only answers the pool's address.
  wallet-api:
    image: bumblebeam-beam
    container_name: wallet-api
    hostname: wallet-api
    restart: unless-stopped
    entrypoint: ["bash", "-c"]
    command:
      - >-
        exec wallet-api --node_addr=beam-node:10000 --wallet_path=/data/wallet.db
        --pass="$$(cat /data/wallet.pass)" --port=10001 --use_http=1
        --ip_whitelist=172.30.1.10 --log_level=info
    working_dir: /data
    volumes:
      - /data/bumblebeam/wallet:/data
    depends_on:
      - beam-node
    networks:
      bumblebeam:                         # to reach the node
      wallet:
        ipv4_address: 172.30.1.2          # the pool calls this address, not the name:
                                          # the name may resolve on the other network

  postgres:
    image: postgres:17-trixie
    container_name: bumblebeam-postgres
    hostname: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bumblebeam
      POSTGRES_DB: bumblebeam
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres.pass
    volumes:
      - /data/bumblebeam/postgres:/var/lib/postgresql/data
      - /data/bumblebeam/secrets/postgres.pass:/run/secrets/postgres.pass:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bumblebeam -d bumblebeam"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - bumblebeam

  pool:
    image: bumblebeam-pool
    container_name: bumblebeam-pool
    hostname: pool
    build:
      context: ./containers/pool
      args:
        BUMBLEBEAM_REF: ${BUMBLEBEAM_REF:-main}
    restart: unless-stopped
    ports:
      - "3333-3334:3333-3334"             # stratum PPLNS / solo
      - "3443-3444:3443-3444"             # stratum TLS PPLNS / solo
      - "127.0.0.1:8080:8080"             # web UI + API, for a reverse proxy
    volumes:
      - /data/bumblebeam/pool:/etc/bumblebeam:ro
    ulimits:
      nofile: 65536
    depends_on:
      postgres:
        condition: service_healthy
      beam-node:
        condition: service_started
    networks:
      bumblebeam:
      wallet:
        ipv4_address: 172.30.1.10

  # Web: pool.bumblebeam.org (and bumblebeam.org, www) through Cloudflare. Host
  # network, so the host firewall (Cloudflare ranges only on 80/443) applies; it
  # proxies to the pool on 127.0.0.1:8080. Same image as on h1: cron runs
  # nginx-reload.sh daily at 04:00, which reloads when certbot left a trigger.
  nginx:
    image: bumblebeam-nginx
    container_name: bumblebeam-nginx
    build: ./containers/nginx
    restart: unless-stopped
    network_mode: host
    environment:
      - HOST_HOSTNAME=${HOST_HOSTNAME:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    volumes:
      - ./containers/nginx/conf:/etc/nginx/conf.d:ro
      - /data/bumblebeam/letsencrypt:/etc/letsencrypt
      - /data/bumblebeam/logs/nginx:/var/log/nginx
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - pool

  # Let's Encrypt for bumblebeam.org + *.bumblebeam.org over Cloudflare DNS-01,
  # same scripts as on h1: checked at start and daily at 03:00 UTC.
  certbot:
    image: bumblebeam-certbot
    container_name: bumblebeam-certbot
    build: ./containers/certbot
    restart: unless-stopped
    environment:
      - HOST_HOSTNAME=${HOST_HOSTNAME:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - TZ=UTC
    volumes:
      - ./containers/certbot/config.json:/app/config.json:ro
      - /data/bumblebeam/logs/certbot:/var/log/certbot
      - /data/bumblebeam/letsencrypt:/etc/letsencrypt
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: "5"

networks:
  bumblebeam:
    name: bumblebeam
  wallet:
    name: bumblebeam-wallet
    internal: true
    ipam:
      config:
        - subnet: 172.30.1.0/24
