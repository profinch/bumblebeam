#!/usr/sbin/nft -f
# bumblebeam host firewall -> /etc/nftables.conf (systemctl enable nftables).
# No "flush ruleset": Docker keeps its own tables (ip nat / ip filter) and a
# reload of this file must not wipe them. Only our table is replaced.
#
# Docker-published ports (p2p, stratum) are DNAT'ed in prerouting and go
# through FORWARD, not INPUT: they are governed by what compose publishes.
# This table guards what runs in the host network: sshd and nginx.

table inet host
delete table inet host

table inet host {
	set public_tcp {
		type inet_service; flags interval
		elements = {
			2201,           # ssh
			10000,          # beam node p2p
			3333-3334,      # stratum
			3443-3444,      # stratum TLS
		}
	}

	# Cloudflare edge (https://www.cloudflare.com/ips/, taken 2026-10-07):
	# the web is reachable through Cloudflare only, as on the other h2n hosts.
	set cloudflare4 {
		type ipv4_addr; flags interval
		elements = { 173.245.48.0/20, 103.21.244.0/22, 103.22.200.0/22, 103.31.4.0/22, 141.101.64.0/18, 108.162.192.0/18, 190.93.240.0/20, 188.114.96.0/20, 197.234.240.0/22, 198.41.128.0/17, 162.158.0.0/15, 104.16.0.0/13, 104.24.0.0/14, 172.64.0.0/13, 131.0.72.0/22 }
	}
	set cloudflare6 {
		type ipv6_addr; flags interval
		elements = { 2400:cb00::/32, 2606:4700::/32, 2803:f800::/32, 2405:b500::/32, 2405:8100::/32, 2a06:98c0::/29, 2c0f:f248::/32 }
	}

	chain input {
		type filter hook input priority filter; policy drop;

		ct state established,related accept
		ct state invalid drop
		iifname "lo" accept
		iifname "docker0" accept
		iifname "br-*" accept

		meta l4proto icmp icmp type { echo-request, destination-unreachable, time-exceeded } limit rate 20/second accept
		meta l4proto ipv6-icmp accept

		tcp dport @public_tcp ct state new accept
		tcp dport { 80, 443 } ip saddr @cloudflare4 ct state new accept
		tcp dport { 80, 443 } ip6 saddr @cloudflare6 ct state new accept
	}
}
