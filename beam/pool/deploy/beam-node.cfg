# Beam mainnet node for the pool. Fill in the three secrets, chmod 600.
port=10000
storage=/var/lib/beam/node/node.db
peer=eu-nodes.mainnet.beam.mw:8100
peer=us-nodes.mainnet.beam.mw:8100
peer=ap-nodes.mainnet.beam.mw:8100
fast_sync=1            # 0 for an archival node that keeps and serves the whole history
mine_online=0
log_level=info
file_log_level=info
# stratum for the pool
stratum_port=8101
stratum_secrets_path=/var/lib/beam/node/secrets
stratum_use_tls=1
miner_key=<beam-wallet export_miner_key --subkey=1>
owner_key=<beam-wallet export_owner_key>
pass=<wallet password>
