<!doctype html>
<html lang="en" class="popup">
<head>
<meta charset="utf-8">
<title>Bridge lab</title>
<!-- A lab page: the Bridge tab's next design, worked on apart from the wallet (made-up figures, nothing is sent).
     chrome-extension://<id>/lab/bridge.html -->
<link rel="stylesheet" href="../ui/tokens.css">
<link rel="stylesheet" href="../ui/base.css">
<link rel="stylesheet" href="../ui/components.css">
<link rel="stylesheet" href="../wallet.css">
<link rel="stylesheet" href="bridge.css">
<script src="../ui/components/bb.js"></script>
</head>
<body>
<header class="top wtop">
  <div class="wrow">
    <span class="brand" id="brand"><bb-logo size="30"></bb-logo><span class="word">Bumble<b>Beam</b> <i class="sub-word">Wallet</i></span></span>
    <div class="dd compact" id="walletDd">
      <button type="button" class="dd-btn" aria-haspopup="listbox" aria-expanded="false"></button>
      <ul class="dd-list" role="listbox" tabindex="-1" hidden></ul>
    </div>
    <button class="ibtn" id="backBtn" aria-label="Back to the wallet" hidden>
      <svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
    <button class="ibtn" id="lockBtn" title="Lock: the password opens it again. Beam goes offline once its transfers in progress are done">
      <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></button>
    <button class="ibtn" id="dappsBtn" aria-label="dApps">
      <svg viewBox="0 0 24 24"><path d="M12 2.8 20 7.2v9.6L12 21.2 4 16.8V7.2z"/><path d="M4 7.2 12 11.6l8-4.4M12 11.6v9.6"/></svg></button>
    <button class="ibtn" id="setBtn" aria-label="Settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  </div>
  <nav class="main-nav wnav" id="tabs">
    <a href="#" data-tab="home">Wallet</a>
    <a href="#" data-tab="bridge" class="active">Bridge</a>
    <a href="#" data-tab="activity">Activity</a>
  </nav>
  <!-- the Activity tab's network, under the tabs in the fixed header: it stays while the list scrolls -->
      <!-- Connected sites' network: in the same place -->
  <div class="wsub split" id="dappBar" hidden><div class="seg mini" id="dappNet"><button class="on" data-n="beam">Beam</button><button data-n="eth">Ethereum</button></div> <div class="seg mini"><button type="button" data-n="cat">Catalog</button></div></div>
  <div class="wsub" id="actBar" hidden><div class="subtabs" id="actNet"><button type="button" class="on" data-n="beam"><i class="chain beam"></i>Beam</button><button type="button" data-n="eth"><i class="chain eth"></i>Ethereum</button></div></div>
</header>

<main>
  <section id="t-bridge" class="screen tab">
    <!-- the Bridge tab's next design: You send over You receive, the networks' dots between them; under them the fee,
         one button, the transfers -->
    <div class="bx">
      <div class="bx-side" id="bxSend">
        <div class="bx-l1"><span class="caps">From</span></div>
        <div class="bx-l2"><input id="bxAmt" inputmode="decimal" placeholder="0" autocomplete="off" aria-label="Amount"></div>
        <span class="bx-issue" id="bxIssue" role="status"></span>
        <div class="bx-right"><span class="bx-l3" id="bxAvail"></span><span class="bx-have" id="bxHave"></span></div>
      </div>
      <!-- Ethereum's account: the wallet tab's own picker, kept outside the cards (they are cut and would clip its
           list) and laid over its place in the Ethereum card (#bxGearBox) -->
      <div class="dd compact acct" id="acctDd"><button type="button" class="dd-btn" aria-haspopup="listbox" aria-expanded="false"></button><ul class="dd-list" role="listbox" tabindex="-1" hidden></ul><input class="bx-addrin" id="bxAddrIn" hidden placeholder="0x… the address it goes to" spellcheck="false" autocomplete="off" aria-label="Ethereum address"></div>
      <button type="button" class="bx-swap" id="bxSwap" aria-label="The other way round"><i class="bx-b"></i><i class="bx-e"></i></button>
      <div class="bx-side" id="bxRecv">
        <div class="bx-l1"><span class="caps">To</span></div>
        <span class="bx-when" id="bxWhen"></span>
        <div class="bx-l2"></div>
        <div class="bx-right2" id="bxThere"><span class="bx-have" id="bxThereHave"></span><span class="bx-l3" id="bxThereWord"></span></div>
      </div>
      <!-- each network's own, moved with it as the way turns (empty for now) -->
      <span class="bx-net" id="bxNetB"></span>
      <span class="bx-key" id="bxKey" hidden></span>
      <span class="bx-net" id="bxNetE"></span>
      <!-- Ethereum's account: its name, and the previous / next one by two small arrows in the cards' own line -->
      <div class="bx-gearbox" id="bxGearBox" aria-hidden="true"></div>
    </div>

    <div class="bx-feeline">
      <span class="caps" title="What the relayer takes: more does not speed it up (about an hour either way), it covers gas rising meanwhile">Fee</span>
      <span class="bx-fee3" id="bxFee" role="radiogroup" aria-label="Relayer fee"><svg class="bx-gauge" viewBox="0 0 74 42" aria-hidden="false"><path class="arc" data-k="cheap" role="radio" aria-label="cheap" d="M6.1 35.8A31 31 0 0 1 19.7 12.3"/><path class="arc" data-k="normal" role="radio" aria-label="normal" d="M23.4 10.1A31 31 0 0 1 50.6 10.1"/><path class="arc" data-k="safe" role="radio" aria-label="safe" d="M54.3 12.3A31 31 0 0 1 67.9 35.8"/><g class="needle" id="bxNeedle"><path d="M37 38V13"/></g><circle class="hub" cx="37" cy="38" r="2.5"/></svg><span class="lv" id="bxFeeLv"></span></span>
      <span class="bx-feeinfo" id="bxFeeInfo"></span>
    </div>
    <div class="row bx-go"><button class="btn solid" id="bxGo">Bridge</button></div>

    <div class="panel bx-list">
      <div class="panel-head"><h3 class="panel-title">Transfers</h3><span class="panel-meta"><a href="https://beamterminal.0xmx.net/#/explorer/bridge" target="_blank" rel="noopener" class="text-link">bridge monitor</a></span></div>
      <div class="list" id="bList"></div>
      <div class="bx-more" id="bMore" hidden></div>
    </div>
  </section>
</main>
<footer class="foot"><p class="foot-copy">Bridge lab · made-up figures, nothing is sent</p></footer>
<script src="../ui/components/dd.js"></script>
<script src="../ui/components/tips.js"></script>
<script src="bridge.js"></script>
</body>
</html>
