<!doctype html>
<html lang="en" class="popup">
<head>
<meta charset="utf-8">
<title>Activity lab</title>
<!-- A lab page: the Activity tab's next design, worked on apart from the wallet (made-up history, nothing is sent).
     chrome-extension://<id>/lab/activity.html -->
<link rel="stylesheet" href="../ui/tokens.css">
<link rel="stylesheet" href="../ui/base.css">
<link rel="stylesheet" href="../ui/components.css">
<link rel="stylesheet" href="../wallet.css">
<link rel="stylesheet" href="activity.css">
<script src="../ui/components/bb.js"></script>
</head>
<body>
<header class="top wtop">
  <div class="wrow">
    <span class="brand" id="brand"><bb-logo size="30"></bb-logo><span class="word">Bumble<b>Beam</b> <i class="sub-word">Wallet</i></span></span>
    <div class="dd compact" id="walletDd">
      <button type="button" class="dd-btn" aria-haspopup="listbox" aria-expanded="false"></button>
      <ul class="dd-list" role="listbox" tabindex="-1" hidden></ul>
    </div>
    <button class="ibtn" id="backBtn" aria-label="Back to the wallet" hidden>
      <svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
    <button class="ibtn" id="lockBtn" title="Lock: the password opens it again. Beam goes offline once its transfers in progress are done">
      <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></button>
    <button class="ibtn" id="dappsBtn" aria-label="dApps">
      <svg viewBox="0 0 24 24"><path d="M12 2.8 20 7.2v9.6L12 21.2 4 16.8V7.2z"/><path d="M4 7.2 12 11.6l8-4.4M12 11.6v9.6"/></svg></button>
    <button class="ibtn" id="setBtn" aria-label="Settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  </div>
  <nav class="main-nav wnav" id="tabs">
    <a href="#" data-tab="home">Wallet</a>
    <a href="#" data-tab="bridge">Bridge</a>
    <a href="#" data-tab="activity" class="active">Activity</a>
  </nav>
  <!-- the Activity tab's network, under the tabs in the fixed header: it stays while the list scrolls -->
      <!-- Connected sites' network: in the same place -->
  <div class="wsub split" id="dappBar" hidden><div class="seg mini" id="dappNet"><button class="on" data-n="beam">Beam</button><button data-n="eth">Ethereum</button></div> <div class="seg mini"><button type="button" data-n="cat">Catalog</button></div></div>
  <div class="wsub" id="actBar"><div class="subtabs" id="actNet"><button type="button" class="on" data-n="beam"><i class="chain beam"></i>Beam</button><button type="button" data-n="eth"><i class="chain eth"></i>Ethereum</button></div></div>
</header>

<main>
  <section id="t-activity" class="screen tab">
    <!-- what to see: everything, what came, what went, the bridge, dApps; a search over names, addresses, comments, amounts -->
    <div class="af-bar">
      <div class="af" id="afKind" role="radiogroup" aria-label="Show">
        <button type="button" class="on" data-k="all">All</button><button type="button" data-k="in">In</button><button type="button" data-k="out">Out</button><button type="button" data-k="bridge">Bridge</button><button type="button" data-k="dapp">dApps</button>
      </div>
      <button type="button" class="ibtn af-find" id="afFind" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.3-4.3"/></svg></button>
    </div>
    <div class="af-search" id="afSearchRow" hidden><input id="afQ" placeholder="name, address, comment, amount" spellcheck="false" autocomplete="off" aria-label="Search"><button type="button" class="af-x" id="afX" aria-label="Clear">×</button></div>
    <div class="list" id="actList"></div>
    <button type="button" class="btn af-more" id="afMore" hidden>Older</button>
  </section>
</main>
<footer class="foot"><p class="foot-copy">Activity lab: made-up history, nothing is sent</p></footer>
<script src="../ui/components/dd.js"></script>
<script src="../ui/components/tips.js"></script>
<script src="activity.js"></script>
</body>
</html>
