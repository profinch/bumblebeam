<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BumbleBeam Explorer - Beam block explorer</title>
<meta name="description" content="BumbleBeam Explorer: an open-source block explorer for Beam (BEAM), served from our own archival node">
<meta name="theme-color" content="#042548">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<!-- the shared look: ui/ in the repo root, copied in by the image build; v=dev becomes the commit hash -->
<link rel="stylesheet" href="/ui/tokens.css?v=dev">
<link rel="stylesheet" href="/ui/base.css?v=dev">
<link rel="stylesheet" href="/ui/components.css?v=dev">
<link rel="stylesheet" href="/explorer.css?v=dev">
<script src="/ui/components/bb.js?v=dev"></script>
</head>
<body>
<header class="top">
  <div class="top-row">
    <a class="brand" href="/" aria-label="BumbleBeam Explorer, home">
      <bb-logo></bb-logo>
      <span class="word">Bumble<b>Beam</b> <i class="sub-word">Explorer</i></span>
    </a>
    <form class="search" id="search" role="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="search-input" placeholder="Height, kernel, contract, asset or name" autocomplete="off" spellcheck="false" aria-label="Block height, kernel ID, contract ID, asset number, name or ticker, or a BANS name">
      <kbd id="search-kbd" title="Press / to search">/</kbd>
    </form>
    <span class="price-chip" id="beam-price" title="The BEAM/USD price comes from Beam’s on-chain price oracle: the median of the values its providers report. The BumbleBeam pool’s full node reads it directly from the blockchain.">BEAM <b id="beam-price-v">loading…</b></span>
    <nav class="main-nav" id="main-nav" aria-label="Main">
      <a href="/" data-route="home">Blocks</a>
      <a href="/assets" data-route="assets">Assets</a>
      <a href="/dex" data-route="dex">DEX</a>
      <a href="/names" data-route="names">Names</a>
      <a href="/contracts" data-route="contracts">Contracts</a>
    </nav>
  </div>
</header>

<div class="demo-banner" id="sync-banner" hidden></div>

<main id="view"></main>

<footer class="foot">
  <a href="https://github.com/profinch/bumblebeam" target="_blank" rel="noopener">GitHub</a>
  <a href="/api">API</a>
  <a href="mailto:support@bumblebeam.org">Support</a>
  <a href="https://pool.bumblebeam.org">Pool</a>
  <a href="https://beam.mw" target="_blank" rel="noopener">Beam</a>
  <span class="dim">Apache-2.0 · data from our own archival node</span>
  <span class="pill-status" id="foot-status"><i></i><span id="foot-status-text">connecting…</span></span>
</footer>

<script src="/ui/components/tips.js?v=dev"></script>
<script src="/ui/components/keys.js?v=dev"></script>
<script src="/app.js?v=dev"></script>
</body>
</html>
