name: images
# The server's images, built here and pushed to ghcr.io/profinch/<image>; the server only pulls them
# (deploy/docker/.env: POOL_IMAGE, STRATUM_IMAGE, POOL_WEB_IMAGE, EXPLORER_WEB_IMAGE, EXPLORER_API_IMAGE).
#   push to main            -> :sha-<7 chars> and :main of every image (a candidate, not a release)
#   tag pool-vX.Y.Z         -> bumblebeam-pool:X.Y.Z (pool-stratum and pool-app)
#   tag web-vX.Y.Z          -> bumblebeam-pool-web:X.Y.Z and bumblebeam-explorer-web:X.Y.Z
#   tag api-vX.Y.Z          -> bumblebeam-explorer-api:X.Y.Z
# The infrastructure images (beam: the official Beam binaries, sha256-pinned; nginx; certbot; prerender) are built
# from their own folders and get only :sha-<7> and :main (BEAM_IMAGE, NGINX_IMAGE, CERTBOT_IMAGE, PRERENDER_IMAGE).
on:
  push:
    branches: [main]
    paths:
      - 'beam/oracle/**'
      - 'beam/vectors/**'
      - 'beam/pool/server/**'
      - 'beam/pool/web/**'
      - 'beam/explorer/web/**'
      - 'beam/explorer/api/**'
      - 'deploy/docker/containers/pool/**'
      - 'deploy/docker/containers/pool-web/**'
      - 'deploy/docker/containers/explorer-web/**'
      - 'deploy/docker/containers/explorer-api/**'
      - 'deploy/docker/containers/beam/**'
      - 'deploy/docker/containers/nginx/**'
      - 'deploy/docker/containers/certbot/**'
      - 'deploy/docker/containers/prerender/**'
      - '.dockerignore'
      - '.github/workflows/images.yml'
    tags: ['pool-v*', 'web-v*', 'api-v*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: bumblebeam-pool, context: ., file: deploy/docker/containers/pool/Dockerfile, tag: pool-v }
          - { name: bumblebeam-pool-web, context: ., file: deploy/docker/containers/pool-web/Dockerfile, tag: web-v }
          - { name: bumblebeam-explorer-web, context: ., file: deploy/docker/containers/explorer-web/Dockerfile, tag: web-v }
          - { name: bumblebeam-explorer-api, context: ., file: deploy/docker/containers/explorer-api/Dockerfile, tag: api-v }
          - { name: bumblebeam-beam, context: deploy/docker/containers/beam, file: deploy/docker/containers/beam/Dockerfile, tag: none }
          - { name: bumblebeam-nginx, context: deploy/docker/containers/nginx, file: deploy/docker/containers/nginx/Dockerfile, tag: none }
          - { name: bumblebeam-certbot, context: deploy/docker/containers/certbot, file: deploy/docker/containers/certbot/Dockerfile, tag: none }
          - { name: bumblebeam-prerender, context: deploy/docker/containers/prerender, file: deploy/docker/containers/prerender/Dockerfile, tag: none }
    runs-on: ubuntu-24.04
    steps:
      - name: Which images this push builds
        id: want
        run: |
          case "$GITHUB_REF" in
            refs/tags/${{ matrix.tag }}*) echo "build=1" >> "$GITHUB_OUTPUT"; echo "version=${GITHUB_REF_NAME#${{ matrix.tag }}}" >> "$GITHUB_OUTPUT" ;;
            refs/tags/*) echo "build=0" >> "$GITHUB_OUTPUT" ;;
            *) echo "build=1" >> "$GITHUB_OUTPUT"; echo "version=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.want.outputs.build == '1'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: steps.want.outputs.build == '1'
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: steps.want.outputs.build == '1'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        if: steps.want.outputs.build == '1'
        run: |
          I=ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          if [ "${GITHUB_REF_TYPE}" = tag ]; then T="$I:${{ steps.want.outputs.version }}"
          else T="$I:sha-${GITHUB_SHA::7},$I:main"; fi
          echo "tags=$T" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        if: steps.want.outputs.build == '1'
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: VERSION=${{ steps.want.outputs.version }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.want.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
