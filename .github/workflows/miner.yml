name: miner
on:
  push:
    branches: [main]
    paths: ['miner/**', 'oracle/**', '.github/workflows/miner.yml']
    tags: ['miner-v*']
  pull_request:
    paths: ['miner/**', 'oracle/**']
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        working-directory: miner
        run: cargo build --release --target ${{ matrix.target }}
      - name: Unit tests
        working-directory: miner
        run: cargo test --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          bin=bumblebeam-miner; [ "${{ runner.os }}" = Windows ] && bin=bumblebeam-miner.exe
          cp miner/target/${{ matrix.target }}/release/$bin dist/
          cp miner/README.md dist/README.md; cp LICENSE dist/LICENSE
          cd dist && if [ "${{ runner.os }}" = Windows ]; then 7z a ../bumblebeam-miner-${{ matrix.name }}.zip .; else tar czf ../bumblebeam-miner-${{ matrix.name }}.tar.gz .; fi
      - uses: actions/upload-artifact@v4
        with:
          name: bumblebeam-miner-${{ matrix.name }}
          path: bumblebeam-miner-${{ matrix.name }}.*
      - name: Release
        if: startsWith(github.ref, 'refs/tags/miner-v')
        uses: softprops/action-gh-release@v2
        with:
          files: bumblebeam-miner-${{ matrix.name }}.*
          generate_release_notes: true
