<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>BumbleBeam Pool - operator</title>
<meta name="theme-color" content="#042548">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<!-- the v=dev query becomes the commit hash in the Docker build, so a release never mixes cached and new files -->
<link rel="stylesheet" href="/styles.css?v=dev">
<style>
  /* the countdown to the next payout, left of the menu */
  .adm-right { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .adm-tabs { display: flex; gap: 6px; }
  .adm-tabs[hidden], .adm-tabs .n[hidden] { display: none; }
  .adm-tabs a { color: var(--text-dim); font: 700 12px var(--font-mono); padding: 8px 10px; border-bottom: 2px solid transparent; }
  .adm-tabs a:hover { color: var(--text); text-decoration: none; }
  .adm-tabs a.active { color: var(--text); border-bottom-color: var(--accent); }
  .adm-tabs .n { display: inline-block; min-width: 16px; margin-left: 4px; padding: 0 4px; border-radius: 8px; font-size: 10px; text-align: center; background: rgba(242, 95, 91, .2); color: var(--color-red); }
  .adm-field { width: 100%; max-width: 520px; background: var(--field-bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 9px 11px; font: 12px var(--font-mono); }
  .adm-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .adm-msg { margin: 0 0 16px; padding: 10px 12px; border-radius: 6px; font: 12px var(--font-mono); line-height: 1.5; word-break: break-word; white-space: pre-line; }
  .adm-msg.ok { color: var(--accent); background: rgba(0, 246, 210, .08); border: 1px solid rgba(0, 246, 210, .3); }
  .adm-msg.err { color: var(--color-red); background: rgba(242, 95, 91, .08); border: 1px solid rgba(242, 95, 91, .35); }
  .adm-addr { font: 12px var(--font-mono); word-break: break-all; color: var(--text-dim); line-height: 1.5; }
  .btn.danger { color: var(--color-red); border-color: rgba(242, 95, 91, .6); background: rgba(242, 95, 91, .06); }
  .btn.danger:hover { background: rgba(242, 95, 91, .18); }
  td.wrap { white-space: normal; word-break: break-word; min-width: 220px; }
  tr.clickable { cursor: pointer; }
  .flag { margin-right: 4px; }
  .adm-next { font: 11px var(--font-mono); color: var(--muted); padding: 0 10px; white-space: nowrap; }
  .adm-next b { color: var(--accent); }
  .adm-next[hidden], .adm-freeze[hidden] { display: none; }
  .adm-next.frozen b { color: var(--color-yellow); }
  .adm-freeze { padding: 3px 8px; font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase; }
  .adm-freeze.frozen { color: var(--color-yellow); border-color: rgba(244, 206, 74, 0.55); }
  /* phones: the brand on its own row, then the freeze button and the countdown, then the menu */
  @media (max-width: 700px) {
    .adm-right { flex: 1 1 100%; margin-left: 0; flex-wrap: wrap; gap: 4px 8px; }
    .adm-next { padding: 0; }
    .adm-tabs { flex: 1 1 100%; justify-content: space-between; gap: 0; }
    .adm-tabs a { padding: 8px 4px; font-size: 11px; }
    .adm-field { max-width: none; }
    .adm-row > .btn { flex: none; }
    td.wrap { min-width: 160px; }
  }
  /* confirmations (ask() in admin.js): the tooltips' look, the light end of the page's gradient
     with the accent edge, instead of the browser's own dialog */
  .adm-ask-bg { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 16px;
    background: rgba(2, 18, 34, 0.55); opacity: 0; transition: opacity 0.14s ease; }
  .adm-ask-bg.on { opacity: 1; }
  .adm-ask { width: min(440px, 100%); padding: 18px 18px 16px 20px; font: 12px/1.6 var(--font-mono); color: rgba(255, 255, 255, 0.9);
    background: linear-gradient(180deg, rgba(18, 108, 150, 0.98), rgba(10, 90, 128, 0.98));
    border: 1px solid rgba(0, 246, 210, 0.32); border-radius: 8px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45), inset 3px 0 0 rgba(0, 246, 210, 0.55);
    transform: translateY(6px); transition: transform 0.14s ease; overflow-wrap: anywhere; white-space: pre-line; }
  .adm-ask-bg.on .adm-ask { transform: none; }
  .adm-ask.danger { border-color: rgba(242, 95, 91, 0.45); box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45), inset 3px 0 0 rgba(242, 95, 91, 0.7); }
  .adm-ask h3 { margin: 0 0 8px; font: 700 11px var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); }
  .adm-ask.danger h3 { color: var(--color-red); }
  .adm-ask .adm-row { justify-content: flex-end; margin-top: 16px; }
  @media (prefers-reduced-motion: reduce) { .adm-ask-bg, .adm-ask { transition: none; } }
  .foot a.mail { font-weight: 400; letter-spacing: 0.02em; text-transform: none; }
  label.chk { font: 11px var(--font-mono); color: var(--muted); display: inline-flex; gap: 5px; align-items: center; }
</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <a class="brand" href="#attention" aria-label="Operator dashboard, home">
      <img class="logo" src="/favicon.svg" alt="">
      <span class="word">Bumble<b>Beam</b> <i class="sub-word">Operator</i></span>
    </a>
    <div class="adm-right">
    <button class="btn small ghost adm-freeze" id="freeze" type="button" hidden></button>
    <span class="adm-next" id="next-pay" title="Next scheduled payout run for every miner at the threshold" hidden></span>
    <nav class="adm-tabs" id="tabs" aria-label="Operator" hidden>
      <a href="#attention" data-tab="attention">Attention<span class="n" id="n-attention" hidden></span></a>
      <a href="#connections" data-tab="connections">Connections</a>
      <a href="#miners" data-tab="miners">Miners</a>
      <a href="#" id="signout">Sign out</a>
    </nav>
    </div>
  </div>
</header>

<main id="view"></main>

<footer class="foot">
  <a href="/">Pool</a>
  <a class="mail" href="mailto:support@bumblebeam.org">support@bumblebeam.org</a>
</footer>

<script src="/admin.js?v=dev"></script>
</body>
</html>
