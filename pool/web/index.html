<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BumbleBeam Pool - community PoW pool for BEAM</title>
<meta name="description" content="BumbleBeam Pool: an open-source, community-run BeamHash III mining pool for Beam (BEAM)">
<meta name="theme-color" content="#042548">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<!-- the v=dev query becomes the commit hash in the Docker build, so a release never mixes cached and new files -->
<link rel="stylesheet" href="/styles.css?v=dev">
</head>
<body>
<header class="top">
  <div class="top-row">
    <a class="brand" href="/" aria-label="BumbleBeam Pool, home">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <defs>
          <linearGradient id="lg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#0b76ff"/><stop offset="1" stop-color="#39fff2"/></linearGradient>
          <clipPath id="lc"><rect x="9.5" y="13.5" width="15" height="9" rx="4.5"/></clipPath>
        </defs>
        <path class="hex" d="M16 2 28 9v14L16 30 4 23V9z" fill="url(#lg)"/>
        <g class="bee">
          <g class="trail" stroke="#fff" stroke-width="1.3" stroke-linecap="round">
            <path class="t1" d="M4.5 20h3.5"/><path class="t2" d="M3.5 23.5h2.5"/>
          </g>
          <ellipse class="wing wl" cx="14.5" cy="10.8" rx="3.6" ry="2.1" transform="rotate(-24 14.5 10.8)" fill="#fff" fill-opacity=".9" stroke="#042548" stroke-width=".6"/>
          <ellipse class="wing wr" cx="20" cy="10.8" rx="3.6" ry="2.1" transform="rotate(24 20 10.8)" fill="#fff" fill-opacity=".9" stroke="#042548" stroke-width=".6"/>
          <rect x="9.5" y="13.5" width="15" height="9" rx="4.5" fill="#042548"/>
          <g clip-path="url(#lc)" fill="#f4ce4a"><rect x="13.3" y="13" width="3" height="10"/><rect x="18.6" y="13" width="3" height="10"/></g>
          <circle class="eye" cx="22.6" cy="17" r=".95" fill="#39fff2"/>
        </g>
      </svg>
      <span class="word">Bumble<b>Beam</b> <i class="sub-word">Pool</i></span>
    </a>
    <a class="btn cta-top" href="/connect" data-route="connect">Start mining</a>
    <form class="search" id="search" role="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="search-input" placeholder="Payout address" autocomplete="off" spellcheck="false" aria-label="Your payout address, to open your hashrate, unpaid balance and payouts">
      <kbd id="search-kbd" title="Press / to search">/</kbd>
    </form>
    <span class="price-chip" id="beam-price" title="The BEAM/USD price comes from Beam’s on-chain price oracle: the median of the values its providers report. The pool’s full node reads it directly from the blockchain.">BEAM <b id="beam-price-v">loading…</b></span>
    <nav class="main-nav" id="main-nav" aria-label="Main">
      <a href="/" data-route="dashboard">Pool</a>
      <a href="/network" data-route="network">Network</a>
      <a href="/blocks" data-route="blocks">Blocks</a>
      <a href="/miners" data-route="miners">Miners</a>
      <a href="/" data-route="my" id="nav-my" hidden>My stats</a>
      <a href="/payments" data-route="payments">Payments</a>
      <a href="/connect" data-route="connect" class="nav-cta">Start mining</a>
    </nav>
  </div>
</header>


<main id="view"></main>

<footer class="foot">
  <div class="tracked-by">
    <span class="tracked-label">Listed on the following pool trackers</span>
    <a href="https://miningboard.com/pools/pool.bumblebeam.org" target="_blank" rel="noopener" title="Tracked on MiningBoard (miningboard.com): the pool's hashrate over 30 days, fees and blocks" aria-label="Tracked on MiningBoard"><img src="/img/miningboard.svg" alt="" width="30" height="30"></a>
    <a href="https://miningchamp.com/pool/bumblebeam" target="_blank" rel="noopener" title="Tracked on MiningChamp (miningchamp.com): the pool's live stats, fees and blocks" aria-label="Tracked on MiningChamp"><img src="/img/miningchamp.svg" alt="" width="35" height="30"></a>
    <a href="https://miningpoolstats.stream/beam" target="_blank" rel="noopener" title="Tracked on MiningPoolStats (miningpoolstats.stream): the pool among all Beam pools by hashrate, fees and blocks" aria-label="Tracked on MiningPoolStats"><img src="/img/miningpoolstats.svg" alt="" width="30" height="30"></a>
  </div>
  <a href="https://explorer.bumblebeam.org" target="_blank" rel="noopener">Explorer</a>
  <a href="/api">API</a>
  <a href="mailto:support@bumblebeam.org">Support</a>
  <span class="pill-status" id="foot-status"><i></i><span id="foot-status-text">connecting…</span></span>
  <p class="foot-copy">© 2026 BumbleBeam · a community PoW mining pool for <a href="https://beam.mw" target="_blank" rel="noopener">Beam (BEAM)</a> · open source under Apache-2.0 on <a href="https://github.com/profinch/bumblebeam" target="_blank" rel="noopener">GitHub</a></p>
</footer>

<script src="/data.js?v=dev"></script>
<script src="/tips.js?v=dev"></script>
<script src="/app.js?v=dev"></script>
</body>
</html>
