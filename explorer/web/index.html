<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BumbleBeam Explorer - Beam block explorer</title>
<meta name="description" content="BumbleBeam Explorer: an open-source block explorer for Beam (BEAM), served from our own archival node">
<meta name="theme-color" content="#042548">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<!-- styles.css is the pool's, copied in by the image build; the v=dev query becomes the commit hash -->
<link rel="stylesheet" href="/styles.css?v=dev">
<link rel="stylesheet" href="/explorer.css?v=dev">
</head>
<body>
<header class="top">
  <div class="top-row">
    <a class="brand" href="/" aria-label="BumbleBeam Explorer, home">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <defs>
          <linearGradient id="lg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#0b76ff"/><stop offset="1" stop-color="#39fff2"/></linearGradient>
          <clipPath id="lc"><rect x="9.5" y="13.5" width="15" height="9" rx="4.5"/></clipPath>
        </defs>
        <path class="hex" d="M16 2 28 9v14L16 30 4 23V9z" fill="url(#lg)"/>
        <g class="bee">
          <g class="trail" stroke="#fff" stroke-width="1.3" stroke-linecap="round">
            <path class="t1" d="M4.5 20h3.5"/><path class="t2" d="M3.5 23.5h2.5"/>
          </g>
          <ellipse class="wing wl" cx="14.5" cy="10.8" rx="3.6" ry="2.1" transform="rotate(-24 14.5 10.8)" fill="#fff" fill-opacity=".9" stroke="#042548" stroke-width=".6"/>
          <ellipse class="wing wr" cx="20" cy="10.8" rx="3.6" ry="2.1" transform="rotate(24 20 10.8)" fill="#fff" fill-opacity=".9" stroke="#042548" stroke-width=".6"/>
          <rect x="9.5" y="13.5" width="15" height="9" rx="4.5" fill="#042548"/>
          <g clip-path="url(#lc)" fill="#f4ce4a"><rect x="13.3" y="13" width="3" height="10"/><rect x="18.6" y="13" width="3" height="10"/></g>
          <circle class="eye" cx="22.6" cy="17" r=".95" fill="#39fff2"/>
        </g>
      </svg>
      <span class="word">Bumble<b>Beam</b> <i class="sub-word">Explorer</i></span>
    </a>
    <form class="search" id="search" role="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="search-input" placeholder="Height, kernel, contract, asset or name" autocomplete="off" spellcheck="false" aria-label="Block height, kernel ID, contract ID, asset number, name or ticker, or a BANS name">
      <kbd id="search-kbd" title="Press / to search">/</kbd>
    </form>
    <nav class="main-nav" id="main-nav" aria-label="Main">
      <a href="/" data-route="home">Blocks</a>
      <a href="/assets" data-route="assets">Assets</a>
      <a href="/dex" data-route="dex">DEX</a>
      <a href="/names" data-route="names">Names</a>
      <a href="/contracts" data-route="contracts">Contracts</a>
    </nav>
  </div>
</header>

<div class="demo-banner" id="sync-banner" hidden></div>

<main id="view"></main>

<footer class="foot">
  <a href="https://github.com/profinch/bumblebeam" target="_blank" rel="noopener">GitHub</a>
  <a href="https://pool.bumblebeam.org">Pool</a>
  <a href="https://beam.mw" target="_blank" rel="noopener">Beam</a>
  <span class="dim">Apache-2.0 · data from our own archival node</span>
  <span class="pill-status" id="foot-status"><i></i><span id="foot-status-text">connecting…</span></span>
</footer>

<script src="/app.js?v=dev"></script>
</body>
</html>
